<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoryOS V21 · לוח תשפ״ז</title><link rel="stylesheet" href="/v21-preview/v21.css"></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">StoryOS V21 · Live Calendar</div><h1>לוח פעילות תשפ״ז</h1><p>ספטמבר 2026 – יוני 2027 · נתונים חיים</p></div><nav class="nav"><a class="btn" href="/v21-preview/management.html">ניהול</a><a class="btn" href="/v21-preview/institution.html">גן קרן</a><a class="btn" href="/v21-preview/operator.html">מפעיל</a></nav></header><div class="notice" id="state">טוען מפגשים מ־Supabase…</div><section class="grid4"><article class="card stat"><strong id="total">—</strong><span>ימי שלישי</span></article><article class="card stat"><strong id="planned">—</strong><span>מפגשים מתוכננים</span></article><article class="card stat"><strong id="holiday">—</strong><span>ימי חופשה</span></article><article class="card stat"><strong>09:00</strong><span>שעת התחלה</span></article></section><section class="months" id="months"></section></main><script src="/v21-preview/v21-live.js"></script><script>(async()=>{const names=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];try{const d=await StoryOSLive.load();total.textContent=d.sessionStats.total;planned.textContent=d.sessionStats.planned;holiday.textContent=d.sessionStats.holiday;state.innerHTML='<b>מחובר:</b> לוח הפעילות נטען ממסד הנתונים. חופשות מסומנות אוטומטית.';const groups={};d.sessions.forEach(s=>{const key=s.session_date.slice(0,7);(groups[key]??=[]).push(s)});months.innerHTML=Object.keys(groups).sort().map(key=>{const [y,m]=key.split('-');return `<article class="card"><h2>${names[Number(m)-1]} ${y}</h2>${groups[key].map(s=>`<div class="session"><div><b>${StoryOSLive.date(s.session_date)}</b><div class="muted">${StoryOSLive.esc(s.institutions?.name||'גן קרן')}${s.cancellation_reason?' · '+StoryOSLive.esc(s.cancellation_reason):''}</div></div><div><b>${StoryOSLive.time(s.planned_start)}–${StoryOSLive.time(s.planned_end)}</b><br>${StoryOSLive.status(s.status)}</div></div>`).join('')}</article>`}).join('');}catch(e){state.innerHTML='<b>שגיאת חיבור:</b> '+StoryOSLive.esc(e.message);}})();</script></body></html>
