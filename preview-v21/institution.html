<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoryOS V21 · גן קרן</title><link rel="stylesheet" href="/v21-preview/v21.css"></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">כרטיס מסגרת · Live</div><h1 id="name">גן קרן</h1><p id="subtitle">טוען נתונים…</p></div><nav class="nav"><a class="btn" href="/v21-preview/management.html">חזרה למסגרות</a><a class="btn" href="/v21-preview/calendar.html">לוח תשפ״ז</a></nav></header><div class="notice" id="state">מתחבר ל־Supabase…</div><section class="grid4"><article class="card"><h3>סטטוס</h3><p id="crm">—</p></article><article class="card"><h3>התקשרות</h3><p id="contract">—</p></article><article class="card"><h3>מועד קבוע</h3><p id="schedule">—</p></article><article class="card"><h3>מחיר</h3><p id="price">—</p></article></section><section class="card"><div class="section-title"><h2>מפגשי השנה</h2><span class="muted" id="summary">טוען…</span></div><div class="table-wrap"><table class="table"><thead><tr><th>תאריך</th><th>שעה</th><th>סטטוס</th><th>הערה</th></tr></thead><tbody id="sessions"><tr><td colspan="4">טוען…</td></tr></tbody></table></div></section></main><script src="/v21-preview/v21-live.js"></script><script>(async()=>{try{const d=await StoryOSLive.load(),k=d.keren;if(!k)throw new Error('גן קרן לא נמצא');name.textContent=k.name;subtitle.textContent=(k.neighborhood||'')+' · נתונים חיים';crm.innerHTML=`<span class="chip ok">${StoryOSLive.esc(k.crm_status)}</span>`;const c=k.contracts?.[0],s=c?.schedules?.[0];contract.innerHTML=c?`<b>${StoryOSLive.esc(c.title)}</b><br>${StoryOSLive.date(c.start_date)}–${StoryOSLive.date(c.end_date)}`:'—';schedule.innerHTML=s?`<b>יום שלישי</b><br>${StoryOSLive.time(s.start_time)}–${StoryOSLive.time(s.end_time)}<br>${StoryOSLive.esc(s.operators?.first_name)} ${StoryOSLive.esc(s.operators?.last_name)}`:'—';price.textContent=c?.agreed_price??'טרם הוגדר';const list=d.sessions.filter(x=>(x.institutions?.name||'')===k.name);summary.textContent=`${list.length} מועדים · ${list.filter(x=>x.status==='HOLIDAY').length} חופשות`;sessions.innerHTML=list.map(x=>`<tr><td><b>${StoryOSLive.date(x.session_date)}</b></td><td>${StoryOSLive.time(x.planned_start)}–${StoryOSLive.time(x.planned_end)}</td><td>${StoryOSLive.status(x.status)}</td><td>${StoryOSLive.esc(x.cancellation_reason)}</td></tr>`).join('');state.innerHTML='<b>מחובר:</b> כרטיס גן קרן מוצג ישירות ממסד הנתונים.';}catch(e){state.innerHTML='<b>שגיאת חיבור:</b> '+StoryOSLive.esc(e.message);}})();</script></body></html>
