[build]
  publish = "public"

[[edge_functions]]
  function = "firebase-media"
  path = "/firebase-media"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/story-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
