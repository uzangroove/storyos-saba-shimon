name: StoryOS v20 release checks

on:
  push:
    branches:
      - release/storyos-v20
    paths:
      - scripts/inline-storyos-v20.mjs
      - scripts/smoke-test-v20.mjs
      - scripts/package-story-covers.mjs
      - scripts/build-verified.sh
      - package.json
      - public/storyos.html
      - public/index.html
      - public/book-viewer.html
      - public/storyos-unified-controls.js
      - public/storyos-v20-music-data.json
      - .github/workflows/storyos-v20-inline.yml

permissions:
  contents: write

jobs:
  validate-v20:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/storyos-v20
          fetch-depth: 0

      - name: Inline and validate v20 core
        run: node scripts/inline-storyos-v20.mjs

      - name: Run StoryOS v20 smoke tests
        run: node scripts/smoke-test-v20.mjs

      - name: Package 30 story-hour covers
        run: |
          node scripts/package-story-covers.mjs
          cd public/downloads
          rm -f storyos-30-covers.zip
          zip -r storyos-30-covers.zip storyos-30-covers
          test "$(find storyos-30-covers -maxdepth 1 -type f | wc -l)" -eq 30
          test -s storyos-30-covers.zip

      - name: Run Netlify static build check
        env:
          NETLIFY: "true"
        run: npm run build

      - name: Validate v20 core markers
        run: |
          grep -q 'גרסה 20' public/storyos.html
          grep -q 'data-program="שיר נולד בגן"' public/storyos.html
          grep -q '"id":"music01"' public/storyos.html
          grep -q '"id":"music22"' public/storyos.html
          grep -q '"totalItems": 88' public/storyos-v20-validation.json
          grep -q '"musicItems": 22' public/storyos-v20-validation.json
          grep -q '"pass": true' public/storyos-v20-validation.json
          grep -q '"pass": true' public/storyos-v20-smoke-report.json
          grep -q '"version": "20.1"' public/storyos-v20-smoke-report.json
          grep -q '"count": 30' public/downloads/storyos-30-covers-manifest.json

      - name: Commit generated reports and cover archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/storyos.html public/storyos-v20-validation.json public/storyos-v20-smoke-report.json public/downloads/storyos-30-covers-manifest.json public/downloads/storyos-30-covers public/downloads/storyos-30-covers.zip
          if git diff --cached --quiet; then
            echo "No generated changes required"
            exit 0
          fi
          git commit -m "Generate StoryOS 30-cover download archive"
          git push origin HEAD:release/storyos-v20
