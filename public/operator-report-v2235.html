<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f4ed"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>StoryOS · דיווח מפעיל · 22.35</title>
<style>
:root{--bg:#f5efe5;--paper:#fffdf9;--ink:#1d2940;--muted:#6a7180;--line:#dfd7ca;--p:#6c50e0;--g:#2f9e5d;--r:#b44343;--shadow:0 12px 34px rgba(40,45,60,.10)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbf8f2,#f2eadf);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif}.app{width:min(760px,100%);margin:auto;min-height:100dvh;padding:16px 14px 34px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.brand{font-weight:900;font-size:1.2rem}.muted{color:var(--muted)}button,input,textarea,select{font:inherit}.btn{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 15px;font-weight:800}.btn.primary{background:var(--p);color:#fff;border-color:#5b43c8}.btn.good{background:var(--g);color:#fff;border-color:#28884f}.btn.danger{background:var(--r);color:#fff;border-color:#973838}.btn:disabled{opacity:.48}.card{background:var(--paper);border:1px solid var(--line);border-radius:23px;padding:17px;box-shadow:var(--shadow);margin-bottom:13px}.event h1{font-size:1.6rem;margin:4px 0 8px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f2eefc;border:1px solid #ded6f7;border-radius:999px;padding:6px 10px;font-size:.9rem}.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.big-actions button{min-height:74px;font-size:1.1rem}.status{display:flex;align-items:center;gap:8px;font-weight:800;margin-top:12px}.dot{width:11px;height:11px;border-radius:50%;background:#aaa}.dot.on{background:#28a25c}.form{display:grid;gap:11px}.form label{display:grid;gap:6px;font-weight:800}.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff}.form textarea{min-height:105px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.feedback-preview{white-space:pre-wrap;line-height:1.55;background:#faf8f3;border:1px dashed #d8d0c5;border-radius:14px;padding:12px}.nav{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.empty{text-align:center;padding:28px 14px;color:var(--muted)}.history-row{padding:10px 0;border-bottom:1px solid #eee7dc}.history-row:last-child{border:0}.sync{font-size:.84rem;margin-top:3px}.sync.ok{color:#2f7d4f}.sync.warn{color:#8a6517}@media(max-width:520px){.row,.big-actions{grid-template-columns:1fr}.big-actions button{min-height:64px}.event h1{font-size:1.35rem}.app{padding-inline:10px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">StoryOS · דיווח מפעיל</div><div class="muted" id="clock"></div><div id="syncState" class="sync warn">ממתין לסנכרון</div></div><button id="backBtn" class="btn">StoryOS</button></div>
  <section id="loginCard" class="card"><h2>התחברות</h2><p class="muted">התחבר כדי לסנכרן דיווחי כניסה, יציאה ומשוב עם StoryOS.</p><button id="loginBtn" class="btn primary">התחבר למערכת</button></section>
  <section id="eventCard" class="card event hidden"></section>
  <section id="reportCard" class="card hidden"></section>
  <section id="feedbackCard" class="card hidden"></section>
  <section id="historyCard" class="card hidden"></section>
</div>
<script src="/storyos-firebase-client.js?v=22.35.0"></script>
<script src="/storyos-v22-school-calendar.js?v=22.35.0"></script>
<script>
(() => {
 const VERSION='22.35.0',ADMIN_PATH='storyos/data/admin-state.json',OP_PATH='storyos/data/operator-state.json',SEED='/storyos-shared-admin-seed.json?v='+VERSION;
 const $=s=>document.querySelector(s);let admin={gardens:[],teachers:[],events:[]},state={version:VERSION,updatedAt:'',reports:[]},active=null;
 const nowIso=()=>new Date().toISOString(),clone=v=>JSON.parse(JSON.stringify(v));
 function tick(){const d=new Date();$('#clock').textContent=d.toLocaleString('he-IL',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}tick();setInterval(tick,30000);
 $('#backBtn').onclick=()=>location.href='/?v='+VERSION;
 async function readJson(path){try{const u=await StoryOSFirebase.getUrl(path),r=await fetch(u+'#'+Date.now(),{cache:'no-store'});return r.ok?await r.json():null}catch(_){return null}}
 async function readSeed(){try{const r=await fetch(SEED,{cache:'no-store'});return r.ok?await r.json():null}catch(_){return null}}
 function mergeBy(base,incoming,key){const m=new Map();for(const x of base||[]){const k=key(x);if(k)m.set(k,clone(x))}for(const x of incoming||[]){const k=key(x);if(k)m.set(k,{...(m.get(k)||{}),...clone(x)})}return [...m.values()]}
 const gardenKey=x=>String(x?.id||x?.name||''),teacherKey=x=>String(x?.id||[x?.garden,x?.name,x?.phone,x?.email].filter(Boolean).join('|')),eventKey=x=>String(x?.id||[x?.garden,x?.date,x?.time,x?.meetingNo].filter(v=>v!==''&&v!=null).join('|'));
 function ensureScheduleEvents(a,seed){for(const s of seed?.recurringSchedules||[]){const dates=(window.StoryOSSchoolCalendar?.rows||[]).filter(r=>r.day===s.day&&r.status!=='סגור').slice(0,Number(s.meetingCount||37)).map(r=>r.date);dates.forEach((date,i)=>{const id=`${s.id}_${i+1}`;if(a.events.some(e=>String(e.id)===id))return;a.events.push({id,date,time:s.time||'',garden:s.garden,program:s.program||'',title:`מפגש שבועי ${i+1}`,status:'planned',duration:s.duration||'45 דקות',scheduleId:s.id,meetingNo:i+1,schoolYear:s.schoolYear||'2026-2027',source:'shared-seed'})})}return a}
 async function loadAll(){
   $('#syncState').textContent='מסנכרן נתונים…';$('#syncState').className='sync warn';
   const [seed,cloud,op]=await Promise.all([readSeed(),readJson(ADMIN_PATH),readJson(OP_PATH)]);
   admin={gardens:mergeBy(seed?.gardens||[],cloud?.gardens||[],gardenKey),teachers:mergeBy(seed?.teachers||[],cloud?.teachers||[],teacherKey),events:mergeBy([],cloud?.events||[],eventKey)};
   admin=ensureScheduleEvents(admin,seed||{});
   state=op&&Array.isArray(op.reports)?op:{version:VERSION,updatedAt:'',reports:[]};
   chooseActive();$('#syncState').textContent=`מסונכרן · ${admin.gardens.length} גנים · ${admin.events.length} מפגשים`;$('#syncState').className='sync ok';render();
 }
 async function writeState(){state.version=VERSION;state.updatedAt=nowIso();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});await StoryOSFirebase.upload(OP_PATH,blob,{contentType:'application/json'});render()}
 function reportFor(ev){let r=state.reports.find(x=>String(x.eventId)===String(ev.id));if(!r){r={eventId:ev.id,garden:ev.garden||'',program:ev.program||'',title:ev.title||'',date:ev.date||'',scheduledTime:ev.time||'',meetingNo:ev.meetingNo||'',status:'planned',checkInAt:'',checkOutAt:'',actualMinutes:'',childrenCount:'',completed:'',operatorNotes:'',feedbackStatus:'not-created',feedbackSentAt:'',feedbackText:''};state.reports.push(r)}return r}
 function todayLocal(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
 function chooseActive(){const today=todayLocal();const events=[...(admin.events||[])].filter(e=>e.status!=='cancelled').sort((a,b)=>String((a.date||'')+(a.time||'')).localeCompare(String((b.date||'')+(b.time||''))));const todayEvents=events.filter(e=>e.date===today);active=todayEvents.find(e=>reportFor(e).status!=='completed')||todayEvents[0]||events.find(e=>e.date>=today)||events.at(-1)||null}
 function fmtTime(iso){if(!iso)return '—';return new Date(iso).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}
 function teacherFor(ev){return (admin.teachers||[]).find(t=>t.garden===ev.garden)||null}
 function feedbackText(ev,r){const meeting=r.meetingNo?`מפגש ${r.meetingNo}`:'המפגש';return `שלום, תודה על ${meeting} ב${ev.garden||'גן'} היום.\nאשמח למשוב קצר כדי לשפר את הפעילויות הבאות:\n\n1. עד כמה הילדים נהנו? 1–5\n2. עד כמה הפעילות התאימה לגיל? 1–5\n3. עד כמה הילדים היו מעורבים? 1–5\n4. מה עבד במיוחד טוב?\n5. מה כדאי לשפר בפעם הבאה?\n6. האם היית ממליצה על הפעילות לגן אחר? כן / לא\n\nתודה רבה!`}
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function render(){
   if(!active){$('#eventCard').classList.remove('hidden');$('#eventCard').innerHTML='<div class="empty">אין כרגע מפגשים מתוכננים.</div>';$('#reportCard').classList.add('hidden');$('#feedbackCard').classList.add('hidden');$('#historyCard').classList.add('hidden');return}
   const r=reportFor(active),teacher=teacherFor(active);$('#loginCard').classList.add('hidden');
   $('#eventCard').classList.remove('hidden');$('#eventCard').innerHTML=`<div class="muted">הפעילות הנוכחית / הקרובה</div><h1>${esc(active.garden||'ללא גן')}</h1><div class="chips"><span class="chip">${esc(active.date||'')}</span><span class="chip">${esc(active.time||'')}</span><span class="chip">${esc(active.duration||'45 דקות')}</span>${r.meetingNo?`<span class="chip">מפגש ${r.meetingNo}</span>`:''}${active.program?`<span class="chip">${esc(active.program)}</span>`:''}</div><div class="big-actions"><button id="checkIn" class="btn good" ${r.checkInAt?'disabled':''}>▶ כניסה לפעילות</button><button id="checkOut" class="btn danger" ${!r.checkInAt||r.checkOutAt?'disabled':''}>■ סיום פעילות</button></div><div class="status"><span class="dot ${r.status==='in-progress'?'on':''}"></span>${r.status==='completed'?'הפעילות הסתיימה':r.status==='in-progress'?'הפעילות מתבצעת עכשיו':'טרם החלה'}</div><div class="muted" style="margin-top:7px">כניסה: ${fmtTime(r.checkInAt)} · יציאה: ${fmtTime(r.checkOutAt)}${r.actualMinutes!==''?` · בפועל ${r.actualMinutes} דקות`:''}</div>`;
   $('#checkIn')?.addEventListener('click',async()=>{if(!confirm('לדווח כניסה לפעילות עכשיו?'))return;r.checkInAt=nowIso();r.status='in-progress';await writeState()});
   $('#checkOut')?.addEventListener('click',async()=>{if(!confirm('לסיים את הפעילות ולשמור שעת יציאה?'))return;r.checkOutAt=nowIso();r.status='completed';r.actualMinutes=Math.max(0,Math.round((new Date(r.checkOutAt)-new Date(r.checkInAt))/60000));await writeState()});
   $('#reportCard').classList.toggle('hidden',!r.checkOutAt);if(r.checkOutAt){$('#reportCard').innerHTML=`<h2>דיווח סיום</h2><form id="reportForm" class="form"><div class="row"><label>מספר ילדים<input name="children" type="number" min="0" value="${esc(r.childrenCount??'')}"></label><label>הפעילות הושלמה<select name="completed"><option value="">בחר</option><option value="כן" ${r.completed==='כן'?'selected':''}>כן</option><option value="חלקית" ${r.completed==='חלקית'?'selected':''}>חלקית</option><option value="לא" ${r.completed==='לא'?'selected':''}>לא</option></select></label></div><label>הערות למפגש הבא<textarea name="notes" placeholder="מה עבד, מה צריך להכין, מה כדאי לשנות...">${esc(r.operatorNotes||'')}</textarea></label><button class="btn primary" type="submit">שמור דיווח והכן משוב לגננת</button></form>`;$('#reportForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);r.childrenCount=f.get('children');r.completed=f.get('completed');r.operatorNotes=String(f.get('notes')||'').trim();r.feedbackText=feedbackText(active,r);r.feedbackStatus='ready';await writeState()}}
   $('#feedbackCard').classList.toggle('hidden',r.feedbackStatus==='not-created');if(r.feedbackStatus!=='not-created'){const text=r.feedbackText||feedbackText(active,r);$('#feedbackCard').innerHTML=`<h2>משוב לגננת</h2><p class="muted">המשוב לא נשלח אוטומטית. בדוק אותו ורק אז שלח.</p><div class="feedback-preview">${esc(text)}</div><div class="nav" style="margin-top:11px"><button id="shareFeedback" class="btn primary">שלח / שתף משוב</button>${teacher?.phone?'<button id="waFeedback" class="btn">WhatsApp לגננת</button>':''}${teacher?.email?'<button id="mailFeedback" class="btn">דוא״ל לגננת</button>':''}</div><div class="muted" style="margin-top:8px">${teacher?`איש קשר: ${esc(teacher.name||'')}${teacher.phone?` · ${esc(teacher.phone)}`:''}${teacher.email?` · ${esc(teacher.email)}`:''}`:'לא נמצא איש קשר משויך לגן.'}</div>`;
      $('#shareFeedback').onclick=async()=>{try{if(navigator.share)await navigator.share({title:`משוב ${active.garden}`,text});else{await navigator.clipboard.writeText(text);alert('המשוב הועתק. אפשר להדביק ב-WhatsApp או במייל.')}r.feedbackStatus='sent';r.feedbackSentAt=nowIso();await writeState()}catch(_){} };
      if(teacher?.phone)$('#waFeedback').onclick=()=>{const p=String(teacher.phone).replace(/\D/g,'').replace(/^0/,'972');window.open(`https://wa.me/${p}?text=${encodeURIComponent(text)}`,'_blank');r.feedbackStatus='sent';r.feedbackSentAt=nowIso();writeState()};
      if(teacher?.email)$('#mailFeedback').onclick=()=>{location.href=`mailto:${encodeURIComponent(teacher.email)}?subject=${encodeURIComponent('משוב קצר על הפעילות ב'+active.garden)}&body=${encodeURIComponent(text)}`;r.feedbackStatus='sent';r.feedbackSentAt=nowIso();writeState()};
   }
   $('#historyCard').classList.remove('hidden');const hist=state.reports.filter(x=>x.status==='completed').slice().reverse().slice(0,8);$('#historyCard').innerHTML=`<h2>דיווחים אחרונים</h2>${hist.length?hist.map(x=>`<div class="history-row"><b>${esc(x.garden)} · ${esc(x.date)}</b><div class="muted">${x.meetingNo?`מפגש ${x.meetingNo} · `:''}${fmtTime(x.checkInAt)}–${fmtTime(x.checkOutAt)} · ${x.actualMinutes||0} דקות · משוב: ${x.feedbackStatus==='sent'?'נשלח':x.feedbackStatus==='ready'?'מוכן':'לא הוכן'}</div></div>`).join(''):'<div class="empty">עדיין אין דיווחים שהושלמו.</div>'}`;
 }
 async function login(){try{await StoryOSFirebase.signInWithPrompt();await loadAll()}catch(_){} }
 $('#loginBtn').onclick=login;
 async function boot(){try{await StoryOSFirebase.ready();const u=await StoryOSFirebase.currentUser();if(u)await loadAll();else{$('#loginCard').classList.remove('hidden');$('#syncState').textContent='נדרשת התחברות';}}catch(e){$('#syncState').textContent='שגיאת חיבור';}}
 boot();
})();
</script>
</body></html>
