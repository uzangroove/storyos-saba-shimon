<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Story OS · סבא שמעון · גרסה 21</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8f4ed}
    #storyosFrame{display:block;width:100%;height:100dvh;border:0;background:#f8f4ed}
    .shell-btn{position:fixed;top:18px;z-index:9999;border:1px solid #dfd7ca;color:#fff;border-radius:14px;padding:11px 16px;box-shadow:0 5px 16px rgba(37,43,62,.18);font:700 16px Arial,"Noto Sans Hebrew",sans-serif;cursor:pointer;white-space:nowrap}
    #scannedBookViewerBtn{left:18px;background:linear-gradient(135deg,#6c50e0,#7d67ed)}
    #managementBtn{left:170px;background:linear-gradient(135deg,#1f7a55,#39a878)}
    .shell-btn:hover{filter:brightness(1.04)}
    @media(max-width:760px){.shell-btn{top:auto;bottom:16px;font-size:14px;padding:10px 13px}#scannedBookViewerBtn{left:16px}#managementBtn{left:148px}}
  </style>
</head>
<body>
  <button id="scannedBookViewerBtn" class="shell-btn" type="button">📖 תצוגת ספר</button>
  <button id="managementBtn" class="shell-btn" type="button">⚙️ ניהול V21</button>
  <iframe id="storyosFrame" src="/storyos.html?v=21.2.0" title="Story OS · סבא שמעון" allow="fullscreen"></iframe>
  <script>
    const storyosFrame = document.getElementById('storyosFrame');
    storyosFrame.addEventListener('load', () => {
      const doc = storyosFrame.contentDocument;
      if (!doc) return;
      const scripts = [
        ['v20UnifiedControlsLoader','/storyos-unified-controls.js?v=21.2.0'],
        ['v21LiveUxLoader','/storyos-live-ux.js?v=21.2.0']
      ];
      for (const [id,src] of scripts) {
        if (doc.getElementById(id)) continue;
        const script = doc.createElement('script');
        script.id = id;
        script.src = src;
        doc.body.appendChild(script);
      }
    });
    document.getElementById('scannedBookViewerBtn').addEventListener('click', () => {
      window.location.href = '/book-flip-viewer.html?v=21.2.0';
    });
    document.getElementById('managementBtn').addEventListener('click', () => {
      window.location.href = '/v21-preview/';
    });
  </script>
</body>
</html>
