<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Story OS · סבא שמעון · גרסה 22</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8f4ed}
    #storyosFrame{display:block;width:100%;height:100dvh;border:0;background:#f8f4ed}
  </style>
</head>
<body>
  <iframe id="storyosFrame" src="/storyos.html?v=22.2.0" title="Story OS · סבא שמעון · גרסה 22" allow="fullscreen"></iframe>
  <script>
    const storyosFrame = document.getElementById('storyosFrame');
    storyosFrame.addEventListener('load', () => {
      const doc = storyosFrame.contentDocument;
      if (!doc) return;

      doc.title = 'Story OS · סבא שמעון · גרסה 22';
      const brandSubtitle = doc.querySelector('.brand p');
      if (brandSubtitle) {
        brandSubtitle.textContent = brandSubtitle.textContent
          .replace(/גרסה\s*20(?:\.\d+)?/g, 'גרסה 22')
          .replace(/ארבעה מסלולי פעילות/g, 'חמישה מסלולי פעילות');
      }

      if (!doc.getElementById('v22UnifiedControlsLoader')) {
        const controls = doc.createElement('script');
        controls.id = 'v22UnifiedControlsLoader';
        controls.src = '/storyos-unified-controls.js?v=22.2.0';
        doc.body.appendChild(controls);
      }

      if (!doc.getElementById('v22ProductionLoader')) {
        const production = doc.createElement('script');
        production.id = 'v22ProductionLoader';
        production.src = '/storyos-v22-production.js?v=22.2.0';
        doc.body.appendChild(production);
      }
    });
  </script>
</body>
</html>
