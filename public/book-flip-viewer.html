<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StoryOS · ספר מדפדף</title>
<style>:root{--bg:#f4efe7;--paper:#fffdf8;--ink:#1d2940;--muted:#667085;--line:#ddd5c9;--primary:#f09a29}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:#f4efe7;color:var(--ink)}body{overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top,.bottom{background:#fffdf9;border-color:var(--line);z-index:10}.top{border-bottom:1px solid var(--line)}.bottom{border-top:1px solid var(--line)}.bar{max-width:1600px;margin:auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.title h1{font-size:1.15rem;margin:0}.title p,.hint{color:var(--muted);font-size:.86rem}.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font-weight:700;cursor:pointer}.btn.primary{background:var(--primary);color:#fff}.stage{min-height:0;display:grid;place-items:center;overflow:hidden;padding:14px;position:relative}.book-shell{width:min(94vw,1400px);height:min(76vh,900px);display:grid;place-items:center}.book{direction:ltr}.empty{max-width:620px;background:var(--paper);padding:24px;border-radius:20px;text-align:center}.page-counter{font-weight:800}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#f4efe7;z-index:5}.hidden{display:none!important}@media(max-width:700px){.title p,.hint{display:none}.book-shell{height:72vh;width:100vw}}</style>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script></head><body><div class="app">
<header class="top"><div class="bar"><div class="title"><h1 id="bookTitle">📖 StoryOS · ספר מדפדף</h1><p>דפדוף משמאל לימין · מחשב, טאבלט וטלפון</p></div><div class="actions"><button class="btn" onclick="location.href='/book-viewer.html'">תצוגה רגילה</button><button id="fullscreenBtn" class="btn">⛶ מסך מלא</button><button class="btn" onclick="location.href='/'">חזרה</button></div></div></header>
<main class="stage"><div id="loading" class="loading">טוען ספר…</div><div id="bookShell" class="book-shell"><div id="book" class="book"></div></div><section id="empty" class="empty hidden"><h2>הספר עדיין לא נטען במכשיר הזה</h2><p>טען את הספר פעם אחת בתצוגה הרגילה ולאחר מכן חזור לכאן.</p><button class="btn primary" onclick="location.href='/book-viewer.html'">פתח נגן ספר וייבא</button></section></main>
<footer class="bottom"><div class="bar"><div class="actions"><button id="prevBtn" class="btn">← הקודם</button><button id="nextBtn" class="btn primary">הבא →</button></div><div id="counter" class="page-counter">—</div><div class="hint">גרור את הדף משמאל לימין, או השתמש בחצים</div></div></footer></div>
<script>(()=>{const BOOK_ID='ayelet-metayelet',DB_NAME='storyos-scanned-books',DB_VERSION=1,STORE='books';const bookEl=document.getElementById('book'),shell=document.getElementById('bookShell'),empty=document.getElementById('empty'),loading=document.getElementById('loading'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),counter=document.getElementById('counter'),fullscreenBtn=document.getElementById('fullscreenBtn'),bookTitle=document.getElementById('bookTitle');let flip=null,urls=[];function openDB(){return new Promise((r,j)=>{const q=indexedDB.open(DB_NAME,DB_VERSION);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}async function loadBook(){const d=await openDB();return new Promise((r,j)=>{const t=d.transaction(STORE,'readonly'),q=t.objectStore(STORE).get(BOOK_ID);q.onsuccess=()=>r(q.result||null);q.onerror=()=>j(q.error)})}function makeUrl(b){const u=URL.createObjectURL(b);urls.push(u);return u}function update(){if(!flip)return;const c=flip.getCurrentPageIndex(),t=flip.getPageCount();counter.textContent=(c+1)+' / '+t;prevBtn.disabled=c<=0;nextBtn.disabled=c>=t-1}async function init(){try{const data=await loadBook();if(!data){loading.classList.add('hidden');shell.classList.add('hidden');empty.classList.remove('hidden');return}bookTitle.textContent='📖 '+(data.title||'ספר מדפדף');const images=[];if(data.coverBlob)images.push(makeUrl(data.coverBlob));(data.pages||[]).forEach(p=>{if(p.imageBlob)images.push(makeUrl(p.imageBlob))});flip=new St.PageFlip(bookEl,{width:520,height:720,size:'stretch',minWidth:280,maxWidth:620,minHeight:390,maxHeight:860,maxShadowOpacity:.35,showCover:true,mobileScrollSupport:false,usePortrait:true,autoSize:true,flippingTime:650,clickEventForward:true});flip.loadFromImages(images);flip.on('flip',update);loading.classList.add('hidden');update()}catch(e){loading.classList.add('hidden');shell.classList.add('hidden');empty.classList.remove('hidden');empty.querySelector('p').textContent='לא ניתן לפתוח את הספר: '+(e?.message||e)}}prevBtn.onclick=()=>flip?.flipPrev('bottom');nextBtn.onclick=()=>flip?.flipNext('top');fullscreenBtn.onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')flip?.flipPrev('bottom');if(e.key==='ArrowRight')flip?.flipNext('top')});init()})();</script></body></html>
