<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StoryOS · ספר מדפדף</title>
<style>
:root{--bg:#f4efe7;--paper:#fffdf8;--ink:#1d2940;--muted:#667085;--line:#ddd5c9;--primary:#f09a29;--shadow:0 14px 36px rgba(22,28,45,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:linear-gradient(180deg,#f7f3ec,#efe9df);color:var(--ink)}
body{overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top,.bottom{background:rgba(255,253,249,.96);backdrop-filter:blur(8px);border-color:var(--line);z-index:10}.top{border-bottom:1px solid var(--line)}.bottom{border-top:1px solid var(--line)}
.bar{max-width:1600px;margin:auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.title{min-width:0}.title h1{font-size:1.15rem;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title p{margin:3px 0 0;color:var(--muted);font-size:.86rem}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;color:var(--ink);font-weight:700;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--primary),#ffb34a);color:#fff;border-color:#df8b1f}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{min-height:0;display:grid;place-items:center;overflow:hidden;padding:14px;position:relative}.book-shell{width:min(94vw,1400px);height:min(76vh,900px);display:grid;place-items:center;filter:drop-shadow(0 16px 24px rgba(25,30,43,.18))}.book{direction:ltr}.empty{max-width:620px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);text-align:center;line-height:1.6}.empty h2{margin-top:0}.empty p{color:var(--muted)}
.page-counter{font-weight:800;min-width:120px;text-align:center}.hint{color:var(--muted);font-size:.86rem}.loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(244,239,231,.82);z-index:5;font-weight:800}.hidden{display:none!important}
@media(max-width:700px){.bar{padding:8px}.title p,.hint{display:none}.btn{padding:9px 10px}.book-shell{height:72vh;width:100vw}.actions{gap:5px}.page-counter{min-width:auto}}
</style>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>
<div class="app">
  <header class="top"><div class="bar">
    <div class="title"><h1 id="bookTitle">📖 StoryOS · ספר מדפדף</h1><p>אפקט דפדוף StPageFlip · תצוגה מותאמת למחשב, טאבלט וטלפון</p></div>
    <div class="actions"><button class="btn" onclick="location.href='/book-viewer.html'">תצוגה רגילה</button><button id="fullscreenBtn" class="btn">⛶ מסך מלא</button><button class="btn" onclick="location.href='/'">חזרה</button></div>
  </div></header>

  <main class="stage">
    <div id="loading" class="loading">טוען ספר…</div>
    <div id="bookShell" class="book-shell"><div id="book" class="book"></div></div>
    <section id="empty" class="empty hidden"><h2>הספר עדיין לא נטען במכשיר הזה</h2><p>הקורא משתמש באותו ספר סרוק שכבר נשמר מקומית ב־StoryOS. טען את הספר פעם אחת בתצוגה הרגילה ולאחר מכן חזור לכאן.</p><button class="btn primary" onclick="location.href='/book-viewer.html'">פתח נגן ספר וייבא</button></section>
  </main>

  <footer class="bottom"><div class="bar">
    <div class="actions"><button id="prevBtn" class="btn">→ הקודם</button><button id="nextBtn" class="btn primary">הבא ←</button></div>
    <div id="counter" class="page-counter">—</div>
    <div class="hint">אפשר לגרור את פינת הדף באצבע/עכבר או להשתמש בחצים</div>
  </div></footer>
</div>
<script>
(() => {
  const BOOK_ID='ayelet-metayelet';
  const DB_NAME='storyos-scanned-books';
  const DB_VERSION=1;
  const STORE='books';
  const bookEl=document.getElementById('book');
  const shell=document.getElementById('bookShell');
  const empty=document.getElementById('empty');
  const loading=document.getElementById('loading');
  const prevBtn=document.getElementById('prevBtn');
  const nextBtn=document.getElementById('nextBtn');
  const counter=document.getElementById('counter');
  const fullscreenBtn=document.getElementById('fullscreenBtn');
  const bookTitle=document.getElementById('bookTitle');
  let flip=null;
  let urls=[];

  function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
  async function loadBook(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly');const req=tx.objectStore(STORE).get(BOOK_ID);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});}
  function cleanup(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[];if(flip){try{flip.destroy()}catch{}flip=null;}bookEl.innerHTML='';}
  function makeUrl(blob){const u=URL.createObjectURL(blob);urls.push(u);return u;}
  function updateCounter(){if(!flip)return;const current=flip.getCurrentPageIndex();const total=flip.getPageCount();counter.textContent=(current+1)+' / '+total;prevBtn.disabled=current<=0;nextBtn.disabled=current>=total-1;}

  async function init(){
    try{
      const data=await loadBook();
      if(!data){loading.classList.add('hidden');shell.classList.add('hidden');empty.classList.remove('hidden');return;}
      cleanup();
      bookTitle.textContent='📖 '+(data.title||'ספר מדפדף');
      const images=[];
      if(data.coverBlob)images.push(makeUrl(data.coverBlob));
      (data.pages||[]).forEach(p=>{if(p.imageBlob)images.push(makeUrl(p.imageBlob));});
      if(!images.length)throw new Error('לא נמצאו תמונות עמודים');

      flip=new St.PageFlip(bookEl,{
        width:520,
        height:720,
        size:'stretch',
        minWidth:280,
        maxWidth:620,
        minHeight:390,
        maxHeight:860,
        maxShadowOpacity:.35,
        showCover:true,
        mobileScrollSupport:false,
        usePortrait:true,
        autoSize:true,
        flippingTime:650,
        clickEventForward:true
      });
      flip.loadFromImages(images);
      flip.on('flip',updateCounter);
      flip.on('changeOrientation',()=>setTimeout(updateCounter,0));
      loading.classList.add('hidden');
      updateCounter();
    }catch(err){
      console.error(err);
      loading.classList.add('hidden');
      shell.classList.add('hidden');
      empty.classList.remove('hidden');
      empty.querySelector('p').textContent='לא ניתן לפתוח את הספר: '+(err?.message||err);
    }
  }

  prevBtn.addEventListener('click',()=>flip?.flipPrev());
  nextBtn.addEventListener('click',()=>flip?.flipNext());
  fullscreenBtn.addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch{}});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')flip?.flipPrev();if(e.key==='ArrowLeft')flip?.flipNext();});
  window.addEventListener('beforeunload',cleanup);
  init();
})();
</script>
</body>
</html>
